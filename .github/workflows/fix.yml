name: Fix Staging + Batch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixes
        run: |
          python3 << 'PYEOF'
          import re
          import textwrap
          from pathlib import Path

          # ────────────────────────────────────────────────────
          # 1. migrations/0003_scrape_staging.sql
          # ────────────────────────────────────────────────────
          Path('migrations').mkdir(exist_ok=True)
          migration = '''CREATE TABLE IF NOT EXISTS scrape_staging (
  slug            TEXT    PRIMARY KEY,
  payload_json    TEXT    NOT NULL,
  files_json      TEXT    NOT NULL,
  source_used     TEXT    NOT NULL,
  voice_actors    TEXT    NOT NULL DEFAULT '[]',
  staged_at       INTEGER NOT NULL
);

CREATE INDEX IF NOT EXISTS idx_scrape_staging_staged_at
  ON scrape_staging (staged_at);
'''
          Path('migrations/0003_scrape_staging.sql').write_text(migration)
          print('OK: 0003_scrape_staging.sql')

          # ────────────────────────────────────────────────────
          # 2. wrangler.toml — BATCH_SIZE=1, MAX_EPISODES=500
          # ────────────────────────────────────────────────────
          p = Path('wrangler.toml')
          s = p.read_text()
          s = re.sub(r'BATCH_SIZE = "8"', 'BATCH_SIZE = "1"', s)
          if 'MAX_EPISODES_PER_ANIME' not in s:
              s = s.replace(
                  'SCRAPE_TTL_DAYS = "30"',
                  'SCRAPE_TTL_DAYS = "30"\nMAX_EPISODES_PER_ANIME = "500"'
              )
          p.write_text(s)
          print('OK: wrangler.toml')

          # ────────────────────────────────────────────────────
          # 3. src/types.ts — tambah Env.MAX_EPISODES_PER_ANIME + ScrapeStagingRow
          # ────────────────────────────────────────────────────
          p = Path('src/types.ts')
          s = p.read_text()
          if 'MAX_EPISODES_PER_ANIME' not in s:
              s = s.replace(
                  '  SCRAPE_TTL_DAYS: string;\n}',
                  '  SCRAPE_TTL_DAYS: string;\n  MAX_EPISODES_PER_ANIME: string;\n}'
              )
          if 'ScrapeStagingRow' not in s:
              staging_type = '''
export interface ScrapeStagingRow {
  slug: string;
  payload_json: string;
  files_json: string;
  source_used: string;
  voice_actors: string;
  staged_at: number;
}
'''
              s = s.replace(
                  'export interface YukionimeListItem',
                  staging_type + '\nexport interface YukionimeListItem'
              )
          p.write_text(s)
          print('OK: src/types.ts')

          # ────────────────────────────────────────────────────
          # 4. src/lib/sources.ts — batasi MAX_EPISODES jadi param
          # ────────────────────────────────────────────────────
          p = Path('src/lib/sources.ts')
          s = p.read_text()
          s = s.replace(
              'const MAX_EPISODES = 700;',
              'const MAX_EPISODES = 500;'
          )
          p.write_text(s)
          print('OK: src/lib/sources.ts (max eps 500)')

          # ────────────────────────────────────────────────────
          # 5. src/lib/state.ts — tambah staging helpers
          # ────────────────────────────────────────────────────
          p = Path('src/lib/state.ts')
          s = p.read_text()
          if 'saveStaging' not in s:
              staging_helpers = '''

/* ============================================================
   STAGING — simpan payload sebelum push ke GitHub
   ============================================================ */

export interface StagingInput {
  slug: string;
  payloadJson: string;
  files: string[];
  sourceUsed: string;
  voiceActors: string;
}

export async function saveStaging(
  env: Env,
  input: StagingInput
): Promise<void> {
  await env.DB
    .prepare(
      `INSERT INTO scrape_staging
        (slug, payload_json, files_json, source_used, voice_actors, staged_at)
       VALUES (?, ?, ?, ?, ?, ?)
       ON CONFLICT(slug) DO UPDATE SET
         payload_json = excluded.payload_json,
         files_json = excluded.files_json,
         source_used = excluded.source_used,
         voice_actors = excluded.voice_actors,
         staged_at = excluded.staged_at`
    )
    .bind(
      input.slug,
      input.payloadJson,
      JSON.stringify(input.files),
      input.sourceUsed,
      input.voiceActors,
      Date.now()
    )
    .run();
}

export async function getStaging(
  env: Env,
  slug: string
): Promise<{
  payloadJson: string;
  files: string[];
  sourceUsed: string;
  voiceActors: string;
} | null> {
  const row = await env.DB
    .prepare('SELECT * FROM scrape_staging WHERE slug = ?')
    .bind(slug)
    .first<{
      slug: string;
      payload_json: string;
      files_json: string;
      source_used: string;
      voice_actors: string;
      staged_at: number;
    }>();

  if (!row) return null;

  let files: string[] = [];
  try {
    files = JSON.parse(row.files_json) as string[];
  } catch {}

  return {
    payloadJson: row.payload_json,
    files,
    sourceUsed: row.source_used,
    voiceActors: row.voice_actors,
  };
}

export async function deleteStaging(env: Env, slug: string): Promise<void> {
  await env.DB
    .prepare('DELETE FROM scrape_staging WHERE slug = ?')
    .bind(slug)
    .run();
}

export async function cleanupOldStaging(
  env: Env,
  olderThanMs: number
): Promise<number> {
  const cutoff = Date.now() - olderThanMs;
  const res = await env.DB
    .prepare('DELETE FROM scrape_staging WHERE staged_at < ?')
    .bind(cutoff)
    .run();
  return res.meta?.changes ?? 0;
}
'''
              s = s.rstrip() + staging_helpers
          p.write_text(s)
          print('OK: src/lib/state.ts (staging helpers)')

          # ────────────────────────────────────────────────────
          # 6. src/handlers/cron.ts — pakai staging
          # ────────────────────────────────────────────────────
          cron_content = textwrap.dedent('''
          import type {
            Env,
            UnifiedVoiceActor,
            FileToCommit,
          } from '../types';
          import {
            chainSearch,
            fetchCharactersFromAniList,
            fetchRelationsFromShikimori,
            fetchEpisodesFromKitsu,
          } from '../lib/sources';
          import { buildAll } from '../lib/transform';
          import { generateSynopsis } from '../lib/ai';
          import {
            githubCommitMultipleFiles,
            githubGetFile,
          } from '../lib/github';
          import {
            fetchYukionimeList,
            seedAnimeList,
            getNextBatch,
            markInProgress,
            markSuccess,
            markFailed,
            getStats,
            writeLog,
            saveStaging,
            getStaging,
            deleteStaging,
            cleanupOldStaging,
          } from '../lib/state';

          const DEFAULT_BATCH = 1;
          const DEFAULT_EPISODES_LIMIT = 500;

          interface BuildPayload {
            markdown: string;
            animeFiles: FileToCommit[];
            voiceActors: UnifiedVoiceActor[];
            sourceUsed: string;
          }

          interface StagedPayload {
            payload: BuildPayload;
            files: string[];
          }

          /* ============================================================
             FETCH + BUILD — panggil sumber, simpan ke staging
             ============================================================ */

          async function fetchAndBuild(
            env: Env,
            slug: string
          ): Promise<StagedPayload> {
            const t0 = Date.now();
            const log = (msg: string) =>
              console.log(`[Fetch:${slug}] ${msg} (+${Date.now() - t0}ms)`);

            log('start chain search');

            const chain = await chainSearch(slug);
            log(`chain: ${chain.source}`);

            const { media, malId, kitsuId } = chain;

            const episodesLimit = parseInt(
              env.MAX_EPISODES_PER_ANIME ?? String(DEFAULT_EPISODES_LIMIT),
              10
            );

            const [charsResult, relationsResult, episodesResult] =
              await Promise.all([
                malId
                  ? fetchCharactersFromAniList(malId).catch(() => null)
                  : Promise.resolve(null),
                malId
                  ? fetchRelationsFromShikimori(malId).catch(() => null)
                  : Promise.resolve(null),
                kitsuId
                  ? fetchEpisodesFromKitsu(kitsuId).catch(() => null)
                  : Promise.resolve(null),
              ]);

            let episodes = episodesResult ?? [];
            if (episodes.length > episodesLimit) {
              episodes = episodes.slice(0, episodesLimit);
              log(`episodes truncated to ${episodesLimit}`);
            }

            const characters = charsResult?.characters ?? [];
            const voiceActors = charsResult?.voiceActors ?? [];
            const relations = relationsResult ?? [];

            log(
              `fetched: chars=${characters.length}, VA=${voiceActors.length}, rel=${relations.length}, eps=${episodes.length}`
            );

            const studio = media.studios?.nodes?.[0]?.name ?? null;

            const synopsis =
              (await generateSynopsis(env, {
                title: media.title.romaji || slug,
                titleEnglish: media.title.english,
                originalSynopsis: media.description,
                year: media.seasonYear,
                genres: media.genres,
                studio,
              })) ?? '';

            log(`synopsis: ${synopsis.length} chars`);

            const built = buildAll({
              slug,
              media,
              malId,
              kitsuId,
              synopsis,
              characters,
              episodes,
              relations,
              voiceActors,
            });

            const markdownPath = `src/content/anime/${slug}.md`;
            const animeFiles: FileToCommit[] = [
              { path: markdownPath, content: built.markdown },
              ...built.animeFiles,
            ];

            return {
              payload: {
                markdown: built.markdown,
                animeFiles,
                voiceActors,
                sourceUsed: chain.source,
              },
              files: animeFiles.map((f) => f.path),
            };
          }

          /* ============================================================
             PUSH — kirim file dari staging ke GitHub
             ============================================================ */

          async function pushStaged(
            env: Env,
            slug: string,
            staged: StagedPayload
          ): Promise<{ ok: boolean; error?: string }> {
            const commitMsg = `feat(${slug}): scrape from ${staged.payload.sourceUsed}`;

            const result = await githubCommitMultipleFiles(
              env,
              staged.payload.animeFiles,
              commitMsg
            );

            if (!result.ok) {
              return { ok: false, error: result.error ?? 'commit failed' };
            }

            return { ok: true };
          }

          /* ============================================================
             MERGE ACTORS
             ============================================================ */

          async function mergeActorFiles(
            env: Env,
            incomingVoiceActors: UnifiedVoiceActor[]
          ): Promise<{ ok: boolean; files: number; error?: string }> {
            if (incomingVoiceActors.length === 0) {
              return { ok: true, files: 0 };
            }

            const grouped = new Map<string, UnifiedVoiceActor[]>();

            for (const va of incomingVoiceActors) {
              const first = (va.id.charAt(0) || '').toLowerCase();
              const letter = /^[a-z]$/.test(first) ? first : '_';
              if (!grouped.has(letter)) grouped.set(letter, []);
              grouped.get(letter)!.push(va);
            }

            const filesToCommit: FileToCommit[] = [];

            for (const [letter, incoming] of grouped) {
              const path = `data/actors/${letter}.json`;
              const existing = await githubGetFile(env, path);

              const map = new Map<string, UnifiedVoiceActor>();

              if (existing) {
                try {
                  const parsed = JSON.parse(existing.content) as UnifiedVoiceActor[];
                  if (Array.isArray(parsed)) {
                    for (const va of parsed) {
                      if (va?.id) map.set(va.id, va);
                    }
                  }
                } catch {}
              }

              let newCount = 0;
              for (const va of incoming) {
                if (map.has(va.id)) {
                  const old = map.get(va.id)!;
                  const merged: UnifiedVoiceActor = {
                    ...old,
                    ...Object.fromEntries(
                      Object.entries(va).filter(([, v]) => v != null && v !== '')
                    ),
                  };
                  map.set(va.id, merged);
                } else {
                  map.set(va.id, va);
                  newCount++;
                }
              }

              if (newCount === 0 && existing) continue;

              const sorted = [...map.values()].sort((a, b) =>
                a.id.localeCompare(b.id)
              );

              filesToCommit.push({
                path,
                content: JSON.stringify(sorted, null, 2) + '\\n',
              });
            }

            if (filesToCommit.length === 0) {
              return { ok: true, files: 0 };
            }

            const result = await githubCommitMultipleFiles(
              env,
              filesToCommit,
              `chore(actors): update ${filesToCommit.length} file(s)`
            );

            if (!result.ok) {
              return { ok: false, files: 0, error: result.error };
            }

            return { ok: true, files: filesToCommit.length };
          }

          /* ============================================================
             PROCESS 1 ANIME
             ============================================================ */

          interface ProcessResult {
            ok: boolean;
            fromStaging: boolean;
            fileCount: number;
            sourceUsed: string;
            error?: string;
            voiceActors: UnifiedVoiceActor[];
          }

          async function processOneAnime(
            env: Env,
            slug: string
          ): Promise<ProcessResult> {
            let staged: StagedPayload | null = null;
            let fromStaging = false;

            const existing = await getStaging(env, slug);
            if (existing) {
              try {
                const parsed = JSON.parse(existing.payloadJson) as BuildPayload;
                staged = {
                  payload: parsed,
                  files: existing.files,
                };
                fromStaging = true;
                console.log(`[Process:${slug}] resume from staging`);
              } catch (err) {
                console.warn(`[Process:${slug}] staging corrupt, refetch`);
                await deleteStaging(env, slug);
              }
            }

            if (!staged) {
              try {
                staged = await fetchAndBuild(env, slug);
              } catch (err) {
                return {
                  ok: false,
                  fromStaging: false,
                  fileCount: 0,
                  sourceUsed: 'fetch-failed',
                  error: (err as Error).message,
                  voiceActors: [],
                };
              }

              await saveStaging(env, {
                slug,
                payloadJson: JSON.stringify(staged.payload),
                files: staged.files,
                sourceUsed: staged.payload.sourceUsed,
                voiceActors: JSON.stringify(staged.payload.voiceActors),
              });

              console.log(`[Process:${slug}] staged ${staged.files.length} files`);
            }

            const pushResult = await pushStaged(env, slug, staged);

            if (!pushResult.ok) {
              return {
                ok: false,
                fromStaging,
                fileCount: 0,
                sourceUsed: staged.payload.sourceUsed,
                error: pushResult.error,
                voiceActors: staged.payload.voiceActors,
              };
            }

            await deleteStaging(env, slug);

            return {
              ok: true,
              fromStaging,
              fileCount: staged.files.length,
              sourceUsed: staged.payload.sourceUsed,
              voiceActors: staged.payload.voiceActors,
            };
          }

          /* ============================================================
             MAIN
             ============================================================ */

          export interface CronRunResult {
            totalAvailable: number;
            batchProcessed: number;
            succeeded: number;
            failed: number;
            skipped: number;
            fromStaging: number;
            actorFilesUpdated: number;
            errors: string[];
          }

          export async function runScrapeCron(env: Env): Promise<CronRunResult> {
            const t0 = Date.now();
            const log = (msg: string) =>
              console.log(`[Cron] ${msg} (+${Date.now() - t0}ms)`);

            const batchSize = parseInt(
              env.BATCH_SIZE ?? String(DEFAULT_BATCH),
              10
            );
            const incremental = env.INCREMENTAL === 'true';
            const ttlDays = parseInt(env.SCRAPE_TTL_DAYS ?? '30', 10);

            log(`start - batch=${batchSize}, incremental=${incremental}`);

            const cleaned = await cleanupOldStaging(env, 24 * 60 * 60 * 1000);
            if (cleaned > 0) log(`cleaned ${cleaned} stale staging`);

            let items: Awaited<ReturnType<typeof fetchYukionimeList>> = [];
            try {
              items = await fetchYukionimeList(env);
              log(`yukionime list: ${items.length} anime`);
            } catch (err) {
              log(`yukionime fetch FAILED: ${err}`);
              return {
                totalAvailable: 0,
                batchProcessed: 0,
                succeeded: 0,
                failed: 0,
                skipped: 0,
                fromStaging: 0,
                actorFilesUpdated: 0,
                errors: [`yukionime fetch: ${(err as Error).message}`],
              };
            }

            const inserted = await seedAnimeList(env, items);
            if (inserted > 0) log(`seeded ${inserted} new anime`);

            const slugs = await getNextBatch(env, batchSize, incremental, ttlDays);
            const stats = await getStats(env);

            log(`batch: ${slugs.length} slugs`);

            if (slugs.length === 0) {
              log('nothing to scrape, exit');
              await writeLog(env, {
                durationMs: Date.now() - t0,
                totalAvailable: stats.total,
                batchSize: 0,
                succeeded: 0,
                failed: 0,
                skipped: 0,
                errors: [],
              });
              return {
                totalAvailable: stats.total,
                batchProcessed: 0,
                succeeded: 0,
                failed: 0,
                skipped: 0,
                fromStaging: 0,
                actorFilesUpdated: 0,
                errors: [],
              };
            }

            let succeeded = 0;
            let failed = 0;
            let skipped = 0;
            let fromStagingCount = 0;
            const errors: string[] = [];
            const allVoiceActors: UnifiedVoiceActor[] = [];

            for (const slug of slugs) {
              const locked = await markInProgress(env, slug);
              if (!locked) {
                log(`skip ${slug} - already in progress`);
                skipped++;
                continue;
              }

              try {
                const result = await processOneAnime(env, slug);

                if (result.ok) {
                  await markSuccess(env, {
                    slug,
                    sourceUsed: result.sourceUsed,
                    files: [],
                  });
                  allVoiceActors.push(...result.voiceActors);
                  succeeded++;
                  if (result.fromStaging) fromStagingCount++;
                  log(`OK ${slug} (${result.fileCount} files)`);
                } else {
                  await markFailed(env, slug, result.error ?? 'unknown');
                  errors.push(`${slug}: ${result.error ?? 'unknown'}`);
                  failed++;
                  log(`FAIL ${slug} - ${result.error}`);
                }
              } catch (err) {
                const msg = (err as Error).message ?? 'unknown';
                await markFailed(env, slug, msg);
                errors.push(`${slug}: ${msg}`);
                failed++;
                log(`FAIL ${slug} - ${msg}`);
              }
            }

            let actorFilesUpdated = 0;

            if (allVoiceActors.length > 0) {
              log(`merging ${allVoiceActors.length} voice actors`);
              const actorResult = await mergeActorFiles(env, allVoiceActors);

              if (actorResult.ok) {
                actorFilesUpdated = actorResult.files;
                log(`actor files updated: ${actorFilesUpdated}`);
              } else {
                errors.push(`actors merge: ${actorResult.error}`);
              }
            }

            const durationMs = Date.now() - t0;

            await writeLog(env, {
              durationMs,
              totalAvailable: stats.total,
              batchSize: slugs.length,
              succeeded,
              failed,
              skipped,
              errors,
            });

            log(
              `done - ${succeeded} ok, ${failed} fail, ${skipped} skip, ${fromStagingCount} from staging (${durationMs}ms)`
            );

            return {
              totalAvailable: stats.total,
              batchProcessed: slugs.length,
              succeeded,
              failed,
              skipped,
              fromStaging: fromStagingCount,
              actorFilesUpdated,
              errors,
            };
          }
          ''').lstrip()
          Path('src/handlers/cron.ts').write_text(cron_content)
          print('OK: src/handlers/cron.ts (staging)')

          PYEOF

      - name: Verify
        run: |
          echo "=== Files check ==="
          test -f migrations/0003_scrape_staging.sql && echo "✓ migration"
          grep -q "MAX_EPISODES_PER_ANIME" wrangler.toml && echo "✓ wrangler.toml"
          grep -q "BATCH_SIZE = \"1\"" wrangler.toml && echo "✓ BATCH_SIZE=1"
          grep -q "saveStaging" src/lib/state.ts && echo "✓ staging helpers"
          grep -q "saveStaging" src/handlers/cron.ts && echo "✓ cron uses staging"
          echo "=== Diff stat ==="
          git diff --stat

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat: staging di D1 + batch 1 + eps limit"
            git push
          fi