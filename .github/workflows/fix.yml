name: Fix Cron Limit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixes
        run: |
          python3 << 'PYEOF'
          import re
          import textwrap

          # 1. wrangler.toml - hapus [triggers]
          p = 'wrangler.toml'
          s = open(p).read()
          s = re.sub(r'\[triggers\]\ncrons = .*?\n\n', '', s, flags=re.DOTALL)
          open(p, 'w').write(s)
          print('OK: wrangler.toml - cron dihapus')

          # 2. src/index.ts - rewrite dengan /run tanpa auth
          index_content = textwrap.dedent('''
          import type { Env } from './types';
          import { runScrapeCron } from './handlers/cron';
          import { getStats } from './lib/state';

          export default {
            async fetch(request: Request, env: Env): Promise<Response> {
              const url = new URL(request.url);

              if (url.pathname === '/' || url.pathname === '/health') {
                return Response.json({
                  status: 'ok',
                  service: 'yukio-api',
                  role: 'anime-scraper',
                  timestamp: new Date().toISOString(),
                });
              }

              if (url.pathname === '/stats') {
                const stats = await getStats(env);
                return Response.json(stats);
              }

              if (url.pathname === '/run') {
                try {
                  const result = await runScrapeCron(env);
                  return Response.json({ ok: true, result });
                } catch (err) {
                  return Response.json(
                    { ok: false, error: (err as Error).message },
                    { status: 500 }
                  );
                }
              }

              return new Response('Not Found', { status: 404 });
            },
          } satisfies ExportedHandler<Env>;
          ''').lstrip()
          open('src/index.ts', 'w').write(index_content)
          print('OK: src/index.ts - /run tanpa auth')

          PYEOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix: HTTP trigger tanpa auth (limit cron)"
            git push
          fi