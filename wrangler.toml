#:schema node_modules/wrangler/config-schema.json

name = "yukio-api"
main = "src/index.ts"
compatibility_date = "2026-10-08"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "yukio-ratings-db"
database_id = "84b22e1e-29ae-437c-b7ec-63337c7387d1"

[ai]
binding = "AI"

[observability]
enabled = true

[vars]
YUKIO_DATA_REPO = "bimaakbar-dev/yukio-data"
YUKIO_DATA_BRANCH = "main"
ANILIST_SORT = "popular"
MAX_EPISODES = "100"
MAX_CHARACTERS = "100"
START_PAGE = "1"
PAGE_STEP = "2"

[dev]
port = 8787
local_protocol = "http"
